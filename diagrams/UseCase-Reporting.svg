<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
  <title id="title">IRO reporting and case management use-case diagram</title><desc id="desc">A Reporter submits and tracks issues and sees public updates. An IRO Coordinator reviews and routes reports, publishes updates, and views aggregate summaries.</desc>
  <style>text{font-family:Arial,sans-serif}.actor{stroke:#153b35;stroke-width:2;fill:none}.actorlabel{font-size:12px;fill:#153b35;text-anchor:middle}.boundary{fill:none;stroke:#9eb4a2;stroke-width:2;stroke-dasharray:8 5}.btitle{font-size:13px;font-weight:bold;fill:#45644d}.u1{fill:#e8f1e7;stroke:#7f9d7a}.u2{fill:#f5f0df;stroke:#c8ab69}.uc{stroke-width:1.5}.uct{font-size:12px;fill:#1f392d;text-anchor:middle}.line{stroke:#45594d;stroke-width:1.5;fill:none}.note{font-size:10px;fill:#625537}</style>
  <rect width="1080" height="720" fill="#fff"/><rect class="boundary" x="230" y="65" width="800" height="590" rx="3"/><text class="btitle" x="248" y="90">IRO WEB APPLICATION</text>
  <g class="actor"><circle cx="110" cy="230" r="15"/><line x1="110" y1="245" x2="110" y2="291"/><line x1="84" y1="260" x2="136" y2="260"/><line x1="110" y1="291" x2="88" y2="322"/><line x1="110" y1="291" x2="132" y2="322"/><text class="actorlabel" x="110" y="346">Reporter</text><text class="actorlabel" x="110" y="362">(student / resident)</text></g>
  <g class="actor"><circle cx="110" cy="478" r="15"/><line x1="110" y1="493" x2="110" y2="539"/><line x1="84" y1="508" x2="136" y2="508"/><line x1="110" y1="539" x2="88" y2="570"/><line x1="110" y1="539" x2="132" y2="570"/><text class="actorlabel" x="110" y="594">IRO Coordinator</text></g>
  <g class="line"><path d="M136 255 L330 170"/><path d="M136 265 L330 286"/><path d="M136 270 L630 286"/><path d="M136 510 L330 406"/><path d="M136 513 L630 406"/><path d="M136 520 L330 531"/><path d="M136 526 L630 531"/><path d="M535 171 L630 171" stroke-dasharray="6 4"/></g>
  <g class="uc"><ellipse class="u1" cx="432" cy="171" rx="102" ry="31"/><text class="uct" x="432" y="175">Submit issue report</text><ellipse class="u1" cx="742" cy="171" rx="112" ry="31"/><text class="uct" x="742" y="175">Choose privacy &amp; broad area</text>
  <ellipse class="u1" cx="432" cy="286" rx="102" ry="31"/><text class="uct" x="432" y="290">Track own report status</text><ellipse class="u1" cx="742" cy="286" rx="112" ry="31"/><text class="uct" x="742" y="290">View public issue updates</text>
  <ellipse class="u2" cx="432" cy="406" rx="102" ry="31"/><text class="uct" x="432" y="410">Review and triage report</text><ellipse class="u2" cx="742" cy="406" rx="112" ry="31"/><text class="uct" x="742" y="410">Categorize and route case</text>
  <ellipse class="u2" cx="432" cy="531" rx="102" ry="31"/><text class="uct" x="432" y="535">Publish safe status update</text><ellipse class="u2" cx="742" cy="531" rx="112" ry="31"/><text class="uct" x="742" y="535">View aggregate summary</text></g>
  <text x="582" y="160" class="note" text-anchor="middle">includes</text><rect x="250" y="665" width="780" height="38" rx="5" fill="#fff7e5" stroke="#ddc98d"/><text class="note" x="266" y="689">Proposed operational system; coursework prototype implements local report entry and a sample status board only.</text>
</svg>
