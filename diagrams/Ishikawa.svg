<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 720" role="img" aria-labelledby="title desc">
  <title id="title">IRO Ishikawa fishbone problem analysis</title><desc id="desc">Possible causes of fragmented, delayed, and unsafe reporting: people, process, technology, governance and trust, communication, and resources and environment.</desc>
  <style>text{font-family:Arial,sans-serif}.head{font-size:18px;font-weight:700;fill:#153b35;letter-spacing:.3px}.sub{font-size:12px;fill:#697871}.cat{fill:#edf4e7;stroke:#9bb78b;stroke-width:1.5}.ct{font-size:13px;font-weight:700;fill:#243b31}.body{font-size:11px;fill:#34483b}.branch{stroke:#77966e;stroke-width:2.5}.spine{stroke:#153b35;stroke-width:4}.effect{fill:#153b35}.et{font-size:16px;font-weight:700;fill:#fff}.es{font-size:12px;fill:#dce9df}</style>
  <rect width="1250" height="720" fill="#fff"/><text x="52" y="37" class="head">IRO · ISHIKAWA (FISHBONE) PROBLEM ANALYSIS</text><text x="53" y="60" class="sub">Potential causes to validate with genuine community feedback</text>
  <line class="spine" x1="92" y1="360" x2="925" y2="360"/><polygon points="925,352 942,360 925,368" fill="#153b35"/>
  <line class="branch" x1="300" y1="360" x2="380" y2="180"/><line class="branch" x1="515" y1="360" x2="590" y2="180"/><line class="branch" x1="730" y1="360" x2="845" y2="180"/>
  <line class="branch" x1="300" y1="360" x2="380" y2="525"/><line class="branch" x1="515" y1="360" x2="590" y2="525"/><line class="branch" x1="730" y1="360" x2="845" y2="525"/>
  <g><rect class="cat" x="220" y="76" width="220" height="100" rx="10"/><text class="ct" x="235" y="100">PEOPLE</text><text class="body" x="235" y="121"><tspan x="235">• Low awareness of the right contact</tspan><tspan x="235" dy="17">• Fear of blame or retaliation</tspan><tspan x="235" dy="17">• Unclear ownership between groups</tspan></text></g>
  <g><rect class="cat" x="480" y="76" width="220" height="100" rx="10"/><text class="ct" x="495" y="100">PROCESS</text><text class="body" x="495" y="121"><tspan x="495">• Reports arrive through separate channels</tspan><tspan x="495" dy="17">• No standard reference or route</tspan><tspan x="495" dy="17">• Follow-up steps may be inconsistent</tspan></text></g>
  <g><rect class="cat" x="740" y="76" width="220" height="100" rx="10"/><text class="ct" x="755" y="100">TECHNOLOGY</text><text class="body" x="755" y="121"><tspan x="755">• Uneven device/data access</tspan><tspan x="755" dy="17">• Inaccessible or difficult channels</tspan><tspan x="755" dy="17">• Separate tools do not share status</tspan></text></g>
  <g><rect class="cat" x="220" y="528" width="220" height="110" rx="10"/><text class="ct" x="235" y="552">GOVERNANCE &amp; TRUST</text><text class="body" x="235" y="574"><tspan x="235">• Privacy/retention rules unclear</tspan><tspan x="235" dy="17">• No visible response owner</tspan><tspan x="235" dy="17">• Public/private detail boundary unclear</tspan></text></g>
  <g><rect class="cat" x="480" y="528" width="220" height="110" rx="10"/><text class="ct" x="495" y="552">COMMUNICATION</text><text class="body" x="495" y="574"><tspan x="495">• Reporter may receive no feedback</tspan><tspan x="495" dy="17">• Updates spread across groups</tspan><tspan x="495" dy="17">• Case progress remains unclear</tspan></text></g>
  <g><rect class="cat" x="740" y="528" width="220" height="110" rx="10"/><text class="ct" x="755" y="552">RESOURCES &amp; ENVIRONMENT</text><text class="body" x="755" y="574"><tspan x="755">• Response staff/funds may be limited</tspan><tspan x="755" dy="17">• Weather, roads, and distance matter</tspan><tspan x="755" dy="17">• Issue volume may exceed capacity</tspan></text></g>
  <rect class="effect" x="946" y="278" width="265" height="164" rx="18"/><text class="et" x="970" y="318">EFFECT</text><text class="es" x="970" y="349"><tspan x="970">Fragmented, delayed, and</tspan><tspan x="970" dy="20">unsafe reporting; low trust</tspan><tspan x="970" dy="20">and weak follow-up</tspan></text>
</svg>
