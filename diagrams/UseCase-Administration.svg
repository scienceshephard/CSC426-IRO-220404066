<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" aria-labelledby="title desc">
  <title id="title">IRO administration use-case diagram</title><desc id="desc">A system administrator manages coordinator roles, issue categories, community areas, and audit history; a coordinator may review audit history.</desc>
  <style>text{font-family:Arial,sans-serif}.actor{stroke:#153b35;stroke-width:2;fill:none}.al{font-size:12px;fill:#153b35;text-anchor:middle}.b{fill:none;stroke:#9eb4a2;stroke-width:2;stroke-dasharray:8 5}.bt{font-size:13px;font-weight:bold;fill:#45644d}.diagram-title{font-size:17px;font-weight:bold;fill:#153b35}.u{fill:#e8f1e7;stroke:#7f9d7a;stroke-width:1.5}.u2{fill:#f5f0df;stroke:#c8ab69;stroke-width:1.5}.ut{font-size:12px;fill:#1f392d;text-anchor:middle}.ln{stroke:#45594d;stroke-width:1.5;fill:none}.note{font-size:10px;fill:#625537}</style>
  <rect width="980" height="610" fill="#fff"/><text class="diagram-title" x="230" y="44">USE CASE · ADMINISTRATION</text><rect class="b" x="230" y="75" width="700" height="440"/><text class="bt" x="248" y="100">IRO ADMINISTRATION</text>
  <g class="actor"><circle cx="110" cy="260" r="15"/><line x1="110" y1="275" x2="110" y2="321"/><line x1="84" y1="290" x2="136" y2="290"/><line x1="110" y1="321" x2="88" y2="352"/><line x1="110" y1="321" x2="132" y2="352"/><text class="al" x="110" y="376">System Administrator</text></g>
  <g class="actor"><circle cx="110" cy="420" r="15"/><line x1="110" y1="435" x2="110" y2="481"/><line x1="84" y1="450" x2="136" y2="450"/><line x1="110" y1="481" x2="88" y2="512"/><line x1="110" y1="481" x2="132" y2="512"/><text class="al" x="110" y="536">IRO Coordinator</text></g>
  <g class="ln"><path d="M136 284 L340 183"/><path d="M136 290 L640 183"/><path d="M136 300 L340 333"/><path d="M136 306 L640 333"/><path d="M136 455 L640 333" stroke-dasharray="5 4"/></g>
  <ellipse class="u" cx="450" cy="183" rx="110" ry="33"/><text class="ut" x="450" y="187">Manage coordinator roles</text><ellipse class="u" cx="750" cy="183" rx="110" ry="33"/><text class="ut" x="750" y="187">Manage issue categories</text>
  <ellipse class="u" cx="450" cy="333" rx="110" ry="33"/><text class="ut" x="450" y="337">Manage community areas</text><ellipse class="u2" cx="750" cy="333" rx="110" ry="33"/><text class="ut" x="750" y="337">Review access/audit history</text>
  <rect x="250" y="550" width="650" height="45" rx="5" fill="#fff7e5" stroke="#ddc98d"/><text class="note" x="264" y="570"><tspan x="264">Production administration requires authenticated and role-checked access.</tspan><tspan x="264" dy="15">The coursework prototype does not implement administrative functions.</tspan></text>
</svg>
